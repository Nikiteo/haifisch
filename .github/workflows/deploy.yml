name: 🚀 Deploy Backend

on:
  push:
    branches: [ add-service ]

jobs:
  deploy:
    name: 🛠️ Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    # ======================
    # 1. ИНИЦИАЛИЗАЦИЯ
    # ======================
    - name: Start deployment
      run: echo "🚀 Starting deployment process"

    # ======================
    # 2. ПОДГОТОВКА
    # ======================
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # ======================
    # 3. СБОРКА
    # ======================
    - name: Install dependencies
      run: |
        npm ci
        echo "BUILD_DATE=$(date +'%Y.%m.%d-%H:%M')" >> $GITHUB_ENV

    - name: Build project
      run: npm run build

    # ======================
    # 4. ДЕПЛОЙ
    # ======================
    - name: Stop and clean server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/haifisch
          echo "🛑 Stopping all Node processes..."
          # Полная остановка всех Node процессов
          sudo pkill -f "node" || true
          sudo pkill -f "pm2" || true
          pm2 delete all || true
          pm2 kill || true
          echo "🧹 Cleaning old files..."
          rm -rf build node_modules
          echo "✅ Server cleaned"

    - name: Upload project files
      uses: appleboy/scp-action@v0.1.4
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "~/haifisch"
        strip_components: 0

    - name: Install and start application
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/haifisch
          echo "📦 Installing dependencies..."
          npm ci --omit=dev

          echo "🔧 Installing build tools..."
          npm install typescript --save-dev

          echo "🏗️ Building project..."
          npm run build

          echo "🔍 Checking for running processes on port 3000..."
          sudo lsof -i :3000 || echo "No processes running on port 3000"

          echo "🚀 Starting application with PM2..."
          pm2 start ecosystem.config.js
          sleep 5 # Даем время для инициализации

          echo "📝 Checking logs..."
          pm2 logs Haifisch --lines 20

          echo "💾 Saving PM2 state..."
          pm2 save --force

          echo "🔄 PM2 status:"
          pm2 list

          echo "🌐 Checking application health..."
          curl -I http://localhost:3000 || echo "Health check failed"

    # ======================
    # 5. УВЕДОМЛЕНИЯ
    # ======================
    - name: Telegram notification
      uses: appleboy/telegram-action@v1.0.1
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          *${{ job.status == 'success' && '✅ DEPLOY SUCCESS' || '❌ DEPLOY FAILED' }}*
          ==================
          *Project*: ${{ github.repository }}
          *Branch*: ${{ github.ref_name }}
          *Version*: ${{ env.BUILD_DATE }}
          *Commit*: `${{ github.sha }}`
          ==================
          [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        format: markdown