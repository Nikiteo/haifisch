name: 🚀 Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: 🛠️ Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    # ======================
    # 1. ИНИЦИАЛИЗАЦИЯ
    # ======================
    - name: Start deployment
      run: echo "🚀 Starting deployment process"

    # ======================
    # 2. ПОДГОТОВКА
    # ======================
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # ======================
    # 3. СБОРКА
    # ======================
    - name: Install dependencies
      run: |
        npm ci
        echo "BUILD_DATE=$(date +'%Y.%m.%d-%H:%M')" >> $GITHUB_ENV

    - name: Build project
      run: npm run build

    # ======================
    # 4. ДЕПЛОЙ
    # ======================
    - name: Force stop existing processes
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "💀 Force stopping all Node processes..."
          sudo pkill -9 -f "node" || true
          sudo pkill -9 -f "pm2" || true
          sudo pkill -9 -f "index.js" || true
          sudo fuser -k 3000/tcp || true

          echo "🧹 Cleaning PM2 state..."
          pm2 delete all || true
          pm2 kill || true
          rm -rf ~/.pm2
          mkdir -p ~/.pm2

          echo "🔍 Verifying processes:"
          ps aux | grep -E 'node|pm2' || echo "No running processes found"

    - name: Clean server directory
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/haifisch
          echo "🧼 Cleaning project files..."
          rm -rf * .[^.]* || true
          echo "✅ Directory cleaned"

    - name: Upload project files
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "~/haifisch"
        strip_components: 0

    - name: Install and start application
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/haifisch
          echo "📦 Installing production dependencies..."
          npm ci --omit=dev

          echo "🔧 Installing build tools..."
          npm install typescript --save-dev

          echo "🏗️ Rebuilding project..."
          npm run build

          echo "🌐 Checking port 3000..."
          sudo lsof -i :3000 || echo "Port 3000 is free"

          echo "🚀 Starting application..."
          pm2 start ecosystem.config.js
          sleep 10

          echo "📜 Application logs:"
          pm2 logs --lines 20

          echo "💾 Saving PM2 state..."
          pm2 save --force

          echo "📊 Deployment status:"
          pm2 list

          echo "🩺 Health check:"
          curl -I http://localhost:3000 || echo "Health check failed"

    # ======================
    # 5. УВЕДОМЛЕНИЯ
    # ======================
    - name: Telegram notification
      uses: appleboy/telegram-action@v1.0.1
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          *${{ job.status == 'success' && '✅ DEPLOY SUCCESS' || '❌ DEPLOY FAILED' }}*
          ==================
          *Project*: ${{ github.repository }}
          *Branch*: ${{ github.ref_name }}
          *Version*: ${{ env.BUILD_DATE }}
          *Commit*: `${{ github.sha }}`
          ==================
          [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        format: markdown

    # ======================
    # 6. ОТЧЁТ
    # ======================
    - name: Create deployment summary
      if: always()
      run: |
        echo "### 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status | Time |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ✅ Success | $(date +'%H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
        echo "| Deploy | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} | $(date +'%H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ env.BUILD_DATE }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY