name: 🚀 Deploy Backend

on:
  push:
    branches: [ add-service ]

jobs:
  deploy:
    name: 🛠️ Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    # ======================
    # 1. ИНИЦИАЛИЗАЦИЯ
    # ======================
    - name: Start deployment
      run: echo "🚀 Starting deployment process"

    # ======================
    # 2. ПОДГОТОВКА
    # ======================
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # ======================
    # 3. СБОРКА
    # ======================
    - name: Install dependencies
      run: |
        npm ci
        echo "BUILD_DATE=$(date +'%Y.%m.%d-%H:%M')" >> $GITHUB_ENV
        echo "COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV

    - name: Build project
      run: npm run build

    # ======================
    # 4. ДЕПЛОЙ
    # ======================
    - name: Stop and clean server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/haifisch

          echo "🛑 Stopping PM2 processes..."
          pm2 stop 'all' || true
          pm2 kill || true

          echo "🛑 Stopping application on port 3000..."
          # Надежное освобождение порта
          sudo ss -tulpn | grep ':3000' | awk '{print $7}' | cut -d\" -f2 | xargs -r kill || true
          sudo fuser -k 3000/tcp || echo "Could not kill process on port 3000 - maybe none running?"

          echo "🧹 Cleaning old files..."
          rm -rf build node_modules .cache
          echo "✅ Server cleaned"

    - name: Upload project files
      uses: appleboy/scp-action@v0.1.4
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "~/haifisch"
        strip_components: 0

    - name: Install and start application
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e # Прерывать при ошибках

          cd ~/haifisch
          echo "📦 Installing dependencies..."
          npm install

          echo "🏗️ Building project..."
          npm run build

          echo "🔍 Checking for running processes on port 3000..."
          sudo lsof -i :3000 || echo "No processes running on port 3000"

          echo "🚀 Starting application with PM2..."
          pm2 start ecosystem.config.js

          echo "⏳ Waiting for application to start (5 seconds)..."
          sleep 5

          echo "💾 Saving PM2 state..."
          pm2 save --force

          echo "📊 PM2 status:"
          pm2 list
    # ======================
    # 5. УВЕДОМЛЕНИЯ
    # ======================
    - name: Telegram notification
      uses: appleboy/telegram-action@v1.0.1
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          *${{ job.status == 'success' && '✅ DEPLOY SUCCESS' || '❌ DEPLOY FAILED' }}*
          ==================
          *Project*: ${{ github.repository }}
          *Branch*: ${{ github.ref_name }}
          *Version*: ${{ env.BUILD_DATE }}
          *Commit*: `${{ env.COMMIT_SHA }}`
          *Commit Message*: ${{ github.event.head_commit.message }}
          ==================
          [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        format: markdown