name: 🚀 Deploy Backend

on:
  push:
    branches: [ add-service ]

jobs:
  deploy:
    name: 🛠️ Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    # ======================
    # 1. ИНИЦИАЛИЗАЦИЯ
    # ======================
    - name: "▛ START DEPLOYMENT ▜"
      run: echo "▌🚀 Starting deployment process ▌"

    - name: Show ASCII banner
      run: |
        echo "  _____ _____ _____ _____ _____ _____ _____ _____  "
        echo " |  _  |  |  |   __|     |   __|  _  |     |   __| "
        echo " |   __|  |  |  |  |  |  |  |  |     | | | |   __| "
        echo " |__|  |_____|_____|_____|_____|__|__|_|_|_|_____| "
        echo "                  DEPLOYMENT v2.0                   "

    # ======================
    # 2. ПОДГОТОВКА
    # ======================
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # ======================
    # 3. СБОРКА
    # ======================
    - name: Install dependencies
      run: |
        echo "::group::📦 Installing dependencies"
        npm ci
        echo "::endgroup::"

    - name: Build project
      run: |
        echo "::group::🔨 Building project"
        npm run build
        echo "BUILD_DATE=$(date +'%Y.%m.%d-%H:%M')" >> $GITHUB_ENV
        echo "::endgroup::"

    # ======================
    # 4. ДЕПЛОЙ
    # ======================
    - name: Prepare deployment
      run: |
        echo "::group::🔌 Deployment target"
        echo "Target: 87.242.119.108"
        echo "User: nikiteo"
        echo "Path: ~/haifisch"
        echo "::endgroup::"

    - name: Clean remote server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🛑 Stopping application..."
          cd ~/haifisch
          pm2 stop all || true
          pm2 flush || true
          pm2 kill || true
          echo "🧹 Cleaning old files..."
          rm -rf build node_modules .env scripts src
          echo "✅ Server cleaned"

    - name: Upload project files
      uses: appleboy/scp-action@v0.1.4
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "~/haifisch"
        strip_components: 0
        overwrite: true

    - name: Restart application
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: 87.242.119.108
        username: nikiteo
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/haifisch
          echo "📦 Installing dependencies..."
          npm ci --production

          echo "🚀 Starting application..."
          pm2 start ecosystem.config.js
          pm2 save

          echo "🔄 Listing processes..."
          pm2 list

          echo "🔍 Application status:"
          pm2 status

    # ======================
    # 5. УВЕДОМЛЕНИЯ
    # ======================
    - name: Telegram notification
      uses: appleboy/telegram-action@v1.0.1
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          *${{ job.status == 'success' && '✅ DEPLOY SUCCESS' || '❌ DEPLOY FAILED' }}*
          ==================
          *Project*: ${{ github.repository }}
          *Branch*: ${{ github.ref_name }}
          *Version*: ${{ env.BUILD_DATE }}
          *Commit*: `${{ github.sha }}`
          ==================
          [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        format: markdown

    # ======================
    # 6. ОТЧЁТ
    # ======================
    - name: Create deployment summary
      if: always()
      run: |
        echo "### 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ✅ Success | ${{ env.BUILD_DATE }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Deploy | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} | $(date +'%H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
        echo "**Duration:** ${{ github.run_duration }}" >> $GITHUB_STEP_SUMMARY

    - name: "▙ END DEPLOYMENT ▟"
      if: always()
      run: echo "▌🏁 Deployment ${{ job.status }} ▌"